name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Cache-bust extension popover URL
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "dist/manifest.json";
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          const sha = process.env.GITHUB_SHA.slice(0, 8);
          const url = new URL(manifest.action.popover);
          url.searchParams.set("build", sha);
          manifest.action.popover = url.toString();
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          fs.writeFileSync("dist/build.txt", process.env.GITHUB_SHA + "\n");
          console.log("Popover URL:", manifest.action.popover);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
