name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Write deployed build manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("dist/index.html", "utf8");

          const scripts = [...html.matchAll(/<script\b[^>]*\bsrc="([^"]+)"[^>]*>/g)]
            .map((m) => m[1])
            .filter((src) => src.startsWith("./assets/"));
          const styles = [...html.matchAll(/<link\b[^>]*\bhref="([^"]+)"[^>]*>/g)]
            .map((m) => m[1])
            .filter((href) => href.startsWith("./assets/") && href.endsWith(".css"));

          if (!scripts.length) throw new Error("Could not find built Reforged entry script");

          const manifest = {
            build: process.env.GITHUB_SHA,
            script: scripts[0],
            styles,
          };

          fs.writeFileSync("dist/app-assets.json", JSON.stringify(manifest, null, 2) + "\n");
          fs.writeFileSync("dist/build.txt", process.env.GITHUB_SHA + "\n");
          console.log(manifest);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
